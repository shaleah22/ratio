<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ratios</title>
<style>
:root{
  --ink:#1D2939; --muted:#667085; --line:#D0D5DD;
  --red:#E5484D; --blue:#2F6FDE; --yellow:#F2B400; --green:#22A06B; --pink:#C2479B;
  --good:#1F8A5B; --bad:#C2372F; --hl:#FFF0B3;
  --c1:#0F7B6C; --c2:#B4541A; --purple:#6A3D9A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Verdana,Geneva,Tahoma,sans-serif;color:var(--ink);background:#fff}
.app{height:100vh;height:100dvh;overflow:hidden;display:grid;grid-template-rows:auto 1fr;gap:18px;padding:16px 28px 24px}

.bar{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.tabs{display:flex;gap:6px}
.tabs button{font:bold 20px Verdana,Geneva,sans-serif;min-width:66px;height:54px;padding:0 12px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.toggle{display:flex;align-items:center;gap:12px;font-size:22px;cursor:pointer;user-select:none}
.toggle input{width:34px;height:34px;margin:0;accent-color:var(--blue);cursor:pointer}
.brand{font:bold 30px Verdana,Geneva,sans-serif;color:var(--ink)}
.count{margin-left:auto;font-size:20px;color:var(--muted)}
.bar .btn.go{height:54px;font-size:20px;padding:0 22px;border-color:var(--good);color:var(--good)}
.bar .btn.go:hover{background:#E3F5EC}
/* turn in: the student code goes to the Google Form */
.ti-modal{position:fixed;inset:0;z-index:150;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:16px;font-family:Verdana,Geneva,sans-serif}
.ti-card{background:#fff;border:2px solid var(--good);border-radius:16px;padding:22px 26px;width:100%;max-width:560px;max-height:94vh;overflow:auto;display:flex;flex-direction:column;gap:12px;color:var(--ink)}
.ti-card h2{margin:0;font-size:30px;color:var(--good)}
.ti-sub{margin:0;font-size:18px}
.ti-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.ti-q{display:inline-flex;align-items:center;justify-content:center;height:32px;border-radius:8px;border:1.5px solid #cbd5e1;background:#fff;color:#94a3b8;font-weight:bold;font-size:14px}
.ti-q.done{background:#E3F5EC;border-color:var(--good);color:var(--good)}
.ti-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:14px;color:var(--muted)}
.ti-legend>span{display:inline-flex;align-items:center;gap:6px}
.ti-legend .ti-q{width:22px;height:22px;font-size:11px}
#tiForm{display:flex;flex-direction:column;gap:8px}
#tiForm label{font-weight:bold}
.ti-warn{background:#E3F5EC;border-radius:10px;padding:8px 12px;font-size:15px}
#tiCode{font:18px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;text-transform:uppercase;max-width:260px;padding:9px 12px;border:1.5px solid #cbd5e1;border-radius:10px}
#tiCode:focus{outline:2px solid var(--good);outline-offset:1px}
.ti-card .btn{height:50px;font-size:18px;padding:0 20px;align-self:flex-start}
.ti-feedback{margin:0;font-size:17px}
.ti-feedback:empty{display:none}
.ti-feedback .ok{color:var(--good);font-size:22px;font-weight:800}
@media (max-width:520px){.ti-grid{grid-template-columns:repeat(5,1fr)}}
.count b{font-size:32px;color:var(--ink);margin-left:6px}

.stage{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(500px,1fr);gap:28px;min-height:0}
.stage.solo{grid-template-columns:minmax(0,1fr)}
.stage.solo .visual{display:none}
.stage.solo .prompt{max-width:none;font-size:34px}
.stage.solo .fp{font-size:96px;column-gap:22px;row-gap:34px}
.stage.solo .fp .fb{height:9px;min-width:140px}
.stage.solo .fp .eqs{font-size:80px}
.stage.solo .fp .mul{font-size:64px;gap:12px}
.stage.solo .fp input{width:180px;height:126px;font-size:76px}
.stage.solo .fp .mul input{width:132px;height:108px;font-size:60px}
.visual{overflow:hidden;position:relative;border:2px solid var(--line);border-radius:18px;min-height:0}
.visual svg{position:absolute;inset:20px;width:calc(100% - 40px);height:calc(100% - 40px)}
.work{min-width:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:28px;min-height:0}

.eqn{display:flex;align-items:flex-end;gap:12px}
.term{display:flex;flex-direction:column;align-items:center;gap:10px}
.tag{min-height:48px;display:flex;align-items:center;justify-content:center}
.tag .word{font-size:20px;font-weight:bold;color:var(--muted);max-width:130px;line-height:1.15}
.tag svg{width:46px;height:46px}
.tag .all{font-size:28px;font-weight:bold;color:var(--muted)}
.term input,.given{width:128px;height:112px;font:bold 60px Verdana,Geneva,sans-serif;text-align:center;border:3px solid var(--ink);border-radius:14px;color:var(--ink);background:#fff}
.given{display:flex;align-items:center;justify-content:center;width:auto;min-width:64px;padding:0 4px;border-color:transparent}
.given.box{width:128px;border:3px dashed var(--line)}
.eqn.wide .term input,.eqn.wide .given.box{width:108px}
.sep{height:112px;display:flex;align-items:center;font:bold 60px Verdana,Geneva,sans-serif}
.term input:disabled{background:#fff;color:var(--ink);opacity:1}
.term input.ok{border-color:var(--good);background:#E3F5EC}
.term input.no{border-color:var(--bad);background:#FCE8E6}
.term input.shown{border-color:var(--blue);background:#EAF0FB}
.eqn.stack{flex-direction:column;align-items:center;gap:18px}
.choices{display:flex;flex-direction:column;gap:14px;width:100%}
.choice{font:bold 26px Verdana,Geneva,sans-serif;padding:18px 28px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);cursor:pointer}
.choice:disabled{cursor:default;color:var(--ink)}
.choice.ok{border-color:var(--good);background:#E3F5EC}
.choice.no{border-color:var(--bad);background:#FCE8E6}
.choice.shown{border-color:var(--blue);background:#EAF0FB}

/* book problems */
.visual.book{display:flex;flex-direction:column;gap:12px;padding:22px 26px}
.qcard{display:flex;gap:16px;align-items:flex-start;font-size:24px;line-height:1.45;text-align:left;max-width:60ch}
.qn{flex:none;min-width:52px;height:52px;padding:0 8px;border-radius:12px;background:var(--ink);color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center}
.qcard p{margin:6px 0 0}
.qcard .rq{white-space:nowrap;font-weight:900;color:var(--ink);font-size:1.12em;background:var(--hl);padding:0 6px;border-radius:6px}
.dia{flex:1;position:relative;min-height:160px}
.visual.book .dia svg{position:absolute;inset:0;width:100%;height:100%}
.visual.book .dia.fbk{flex:2.4}
.visual.book .dia.two{min-height:110px}
.term input.long{font-size:40px}
.given{white-space:nowrap}
.qn{white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-weight:bold;line-height:1.15;margin:0 4px}
.fr span+span{border-top:3px solid var(--ink);padding:0 6px}
.guide{display:flex;flex-direction:column;gap:10px;align-items:stretch;min-width:min(100%,420px)}
.guide:empty{display:none}
.gstep{display:flex;align-items:center;gap:14px;padding:8px 16px;border:2px solid var(--line);border-radius:12px;text-align:left}
.gstep.now{border-color:var(--blue);background:#F5F8FE}
.gn{flex:none;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;font-weight:bold;font-size:18px;display:flex;align-items:center;justify-content:center}
.gcap{display:block;font-size:16px;color:var(--muted)}
.gx{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:30px;flex-wrap:wrap}
.gx.txt{font-size:20px}
.gl{font-size:18px;color:var(--muted)} .gl svg{width:30px;height:30px;display:block}
.gk{color:var(--blue)} .ga{color:var(--good)}
.kin{width:84px;height:58px;font:bold 30px Verdana,Geneva,sans-serif;text-align:center;border:3px solid var(--blue);border-radius:10px;color:var(--ink);background:#fff}
.kin.no{border-color:var(--bad);background:#FCE8E6}
.eqn.rt input.kin{width:84px;height:62px;font-size:30px;margin:0 8px;border-color:var(--blue)}
.eqn.rt input.kin.no{border-color:var(--bad)}
.lock{border-style:dashed!important;border-color:var(--line)!important}
.fbtabs{display:flex;gap:8px;flex-wrap:wrap}
.fbtabs button{font:bold 17px Verdana,Geneva,sans-serif;padding:8px 14px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer}
.fbtabs button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* answer feedback: proportion, ratio table with unit rate, graph */
.fx{font-family:Verdana,Geneva,sans-serif;font-weight:bold}
.f-ik{fill:var(--ink)} .f-mu{fill:var(--muted)} .f-gd{fill:var(--good)} .f-rd{fill:var(--red)} .f-bl{fill:var(--blue)} .f-pu{fill:var(--purple)}
.f-c1{fill:var(--c1)} .f-c2{fill:var(--c2)} .f-or{fill:#C2410C} .f-gy{fill:#7B8591}
.f-sm{font-weight:normal}
.farc{fill:none;stroke:var(--red);stroke-width:4;stroke-linecap:round}
.fbar{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.fsep{stroke:var(--line);stroke-width:2;stroke-dasharray:6 7}
.fth{fill:#F3F6FA;stroke:var(--line);stroke-width:2}
.ftd{fill:#fff;stroke:var(--line);stroke-width:2}
.ftd.gv{fill:#EAF0FB} .ftd.an{fill:#E3F5EC}
.fun{fill:none;stroke:var(--purple);stroke-width:5}
.fgrid{stroke:#E3E8EF;stroke-width:1.5} .fax{stroke:var(--ink);stroke-width:2.5}
.fline{stroke:var(--blue);stroke-width:3;stroke-dasharray:8 7}
.flead{stroke:var(--purple);stroke-width:1.5;stroke-dasharray:3 4}

/* ratio-table problems and fraction answers */
.eqn.rt{flex-direction:column;align-items:stretch;gap:12px}
/* equivalent ratios as a proportion: original ratio = new ratio */
.prop{display:grid;grid-template-columns:auto 124px 56px 124px;grid-template-rows:auto auto 80px 6px 80px auto;column-gap:10px;row-gap:6px;align-items:center;justify-items:center;
  grid-template-areas:". h1 . h2" ". at at at" "l1 a eq c" ". b1 eq b2" "l2 bb eq d" ". ab ab ab"}
.prop .ph{font-size:15px;font-weight:bold;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.prop .pl{justify-self:end;font-size:20px;font-weight:bold;color:var(--muted);text-align:right;max-width:160px;line-height:1.15}
.prop .pl svg{width:46px;height:46px;display:block}
.prop .pg{font:bold 50px Verdana,Geneva,sans-serif;white-space:nowrap}
.prop .pbar{width:100%;height:6px;background:var(--ink);border-radius:3px}
.prop .peq{font:bold 54px Verdana,Geneva,sans-serif}
.prop .parc{width:316px;height:62px;display:block}
.prop .parc text{font:bold 22px Verdana,Geneva,sans-serif;fill:var(--red)}
.prop .parc path.ln{fill:none;stroke:var(--red);stroke-width:3.5;stroke-linecap:round}
.prop input{width:120px;height:78px;font:bold 44px Verdana,Geneva,sans-serif;text-align:center;border:3px solid var(--ink);border-radius:14px;color:var(--ink);background:#fff}
.prop input.long{font-size:32px}
.prop input:disabled{background:#fff;color:var(--ink);opacity:1}
.prop input.ok{border-color:var(--good);background:#E3F5EC}
.prop input.no{border-color:var(--bad);background:#FCE8E6}
.prop input.shown{border-color:var(--blue);background:#EAF0FB}
.rtab{display:grid;grid-template-columns:auto auto auto auto;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:#fff}
.rtab .rh{background:#F3F6FA;font-size:16px;font-weight:bold;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:12px 16px;border-bottom:3px solid var(--ink);text-align:center;white-space:nowrap}
.rtab .rc{display:flex;align-items:center;justify-content:center;padding:8px 16px;border-top:1.5px solid var(--line)}
.rtab .rh+.rc,.rtab .rh+.rc+.rc,.rtab .rh+.rc+.rc+.rc,.rtab .rh+.rc+.rc+.rc+.rc{border-top:0}
.rtab .c2,.rtab .c3,.rtab .c4{border-left:1.5px solid var(--line)}
.rtab .c3{background:#FFF6F6}
.rtab .rl{justify-content:flex-end;font-size:20px;font-weight:bold;color:var(--muted);text-align:right;line-height:1.15;max-width:190px}
.rtab .rc.gv{background:#F2F6FD}
.rtab .rm{font:bold 38px Verdana,Geneva,sans-serif;gap:8px;min-width:150px}
.rtab .rm .x{color:var(--red)}
.rtab .rm .kq{color:var(--blue)}
.eqn.rt .rtab input.kin{margin:0}
.rtab input.kmul{width:84px;height:62px;font:bold 30px Verdana,Geneva,sans-serif;text-align:center;border:3px solid var(--blue);border-radius:10px;color:var(--ink);background:#fff}
.rtab input.kmul.no{border-color:var(--bad);background:#FCE8E6}
.rtab .rl{white-space:nowrap}
.rtab .rl svg{width:46px;height:46px;display:block}
.rtab .given{background:transparent}
.rrow .rl{width:150px;text-align:right;font-size:20px;font-weight:bold;color:var(--muted);line-height:1.15}
.eqn.rt .given,.eqn.rt input,.eqn.rt .given.box,.eqn.rt .sep{height:84px;font-size:42px}
.eqn.rt input,.eqn.rt .given.box{width:128px}
.eqn.rt .given{min-width:70px}
.eqn.rt .sep{font-size:30px;color:var(--muted);white-space:nowrap}
.eqn.rt .kq{color:var(--blue);margin:0 8px}
.rtab input{font:bold 42px Verdana,Geneva,sans-serif;text-align:center;border:3px solid var(--ink);border-radius:14px;color:var(--ink);background:#fff}
.rtab input.long{font-size:30px}
.rtab input:disabled{background:#fff;color:var(--ink);opacity:1}
.rtab input.ok{border-color:var(--good);background:#E3F5EC}
.rtab input.no{border-color:var(--bad);background:#FCE8E6}
.rtab input.shown{border-color:var(--blue);background:#EAF0FB}
.fracw{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-right:164px}
.fracw .term{flex-direction:row;gap:14px}
.fracw .tag{width:150px;justify-content:flex-end;text-align:right}
.simpw{display:flex;align-items:center;gap:22px}
.simpw .fracw{padding-right:0}
.fracs{display:flex;flex-direction:column;align-items:center;gap:12px}
.fracs .tag{display:none}
.fracs .fbar3{height:6px;width:148px;background:var(--ink);border-radius:3px}
.fracw .fbar2{height:6px;width:148px;margin-left:154px;background:var(--ink);border-radius:3px}

.prompt{font-size:30px;line-height:1.35;max-width:20ch}
.eqn.hidetags .tag{visibility:hidden}
.feedback{font-size:26px;min-height:36px;font-weight:bold}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)} .feedback.info{color:var(--blue)}
.actions{display:flex;gap:14px;flex-wrap:wrap}
.btn{font:bold 22px Verdana,Geneva,sans-serif;height:62px;padding:0 32px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn[hidden]{display:none}
:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}

/* svg */
.c-red{fill:var(--red)} .c-blue{fill:var(--blue)} .c-yellow{fill:var(--yellow)} .c-green{fill:var(--green)} .c-pink{fill:var(--pink)}
.cnt{font:bold 34px Verdana,Geneva,sans-serif;fill:var(--ink)}
.cnt.big{font-size:44px}
.row{transition:opacity .4s}
.dim{opacity:.15}
.hlbox{fill:var(--hl)}
.axis,.tick{stroke:var(--ink);stroke-width:3}
.arrow{fill:var(--ink)}
.lbl{font:bold 26px Verdana,Geneva,sans-serif;fill:var(--ink)}
.lbl.q{fill:var(--blue)}
.nm{font:bold 24px Verdana,Geneva,sans-serif;fill:var(--muted)}
.bl{font:bold 24px Verdana,Geneva,sans-serif;fill:var(--ink)}
.seg{stroke:#fff;stroke-width:3}
.whole{fill:none;stroke:var(--ink);stroke-width:3;stroke-dasharray:10 8}
.grp{fill:#F7F9FC;stroke:var(--ink);stroke-width:2.5}
.pop{animation:pop .4s cubic-bezier(.3,1.4,.6,1) both;transform-box:fill-box;transform-origin:center}
.rtab .rl,.rtab .c1{grid-column:1}.rtab .c2{grid-column:2}.rtab .c3{grid-column:3}.rtab .c4{grid-column:4}
.rtab.s1 .c3>*,.rtab.s1 .c4>*,.rtab.s2 .c3>*{visibility:hidden}
.rtab.s1 .c3,.rtab.s1 .c4,.rtab.s2 .c3{background:#fff}
.work.tbl .feedback{min-height:72px}
.rtab .later>*{visibility:hidden}
.rtab .appear>*{animation:colin .45s ease both}
.rtab .rc.now{background:#FFF8DB}
.rtab .rh b{display:block;text-transform:none;letter-spacing:0;font-size:19px;color:var(--ink);white-space:nowrap}
.rtab .rh small{display:block;font-size:11px;margin-top:3px}
.rtab.anim4 .c4>*,.rtab.anim3 .c3>*{animation:colin .45s ease both}
@keyframes colin{from{opacity:0;transform:translateX(-16px)}}
.eqn.tape{flex-direction:column;align-items:flex-start;gap:14px}
.tline{display:flex;align-items:center;gap:14px;font:bold 34px Verdana,Geneva,sans-serif;white-space:nowrap}
.tline .tp{color:var(--muted);font-size:21px;white-space:normal;max-width:220px;line-height:1.15}
.tline input{width:116px;height:72px;font:bold 38px Verdana,Geneva,sans-serif;text-align:center;border:3px solid var(--ink);border-radius:12px;color:var(--ink);background:#fff}
.tline input:disabled{background:#fff;color:var(--ink);opacity:1}
.tline input.ok{border-color:var(--good);background:#E3F5EC}
.tline input.no{border-color:var(--bad);background:#FCE8E6}
.tline input.shown{border-color:var(--blue);background:#EAF0FB}
.tline input.long{font-size:28px}
.tline.later{visibility:hidden}
/* big proportion: a/b = ?/d, with the multiplier box between the known pair */
.fp{display:grid;grid-auto-flow:column;grid-template-rows:auto 8px auto;column-gap:14px;row-gap:26px;align-items:center;justify-items:center;margin:8px auto;font:bold 64px Verdana,Geneva,sans-serif;color:var(--ink)}
.fp .fb{width:100%;min-width:96px;height:7px;border-radius:4px;background:var(--ink)}
.fp .eqs{font-size:52px;color:var(--muted);line-height:0}
.fp .mul{display:flex;align-items:center;gap:8px;color:var(--bad);font-size:44px}
.fp .mul.done{color:var(--blue)}
.fp input{width:128px;height:88px;font:bold 52px Verdana,Geneva,sans-serif;text-align:center;border:3px solid var(--ink);border-radius:14px;color:var(--ink);background:#fff}
.fp .mul input{width:96px;height:76px;font-size:42px;border-color:var(--blue)}
.fp input:disabled{opacity:1;background:#fff;color:var(--ink)}
.fp input.ok{border-color:var(--good);background:#E3F5EC}
.fp input.no{border-color:var(--bad);background:#FCE8E6}
.fp input.shown{border-color:var(--blue);background:#EAF0FB}
.fp .gap{visibility:hidden}
.tline .tpre{display:none}
.tline.solved .tpre{display:inline}
.tline.appear{animation:colin .45s ease both}
.tbox{stroke:#fff;stroke-width:3}
.tval{font:bold 22px Verdana,Geneva,sans-serif;fill:#fff}
.brace{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.cnt.qv{fill:var(--blue)}
.tval.dk{fill:var(--ink)}
.xtra{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-dasharray:7 6}
@keyframes pop{from{opacity:0;transform:scale(.5)}}

.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.pcard{fill:#F7F9FC;stroke:var(--ink);stroke-width:2.5}
.pcard.on{fill:var(--hl)}
.stem{stroke:#3F8F3A;stroke-width:3;stroke-linecap:round}
.wrapr{fill:#FBE3EC;stroke:#C2479B;stroke-width:2.5;stroke-linejoin:round}
.bow{fill:#C2479B}
.plab{font:bold 20px Verdana,Geneva,sans-serif;fill:var(--muted)}
.pnum{font:bold 26px Verdana,Geneva,sans-serif;fill:var(--ink)}
.pnum.q{fill:var(--blue)}

/* teacher panel */
dialog{border:2px solid var(--ink);border-radius:16px;padding:24px 28px;font-family:Verdana,Geneva,sans-serif;color:var(--ink)}
dialog::backdrop{background:rgba(29,41,57,.35)}
dialog h2{margin:0 0 14px;font-size:22px}
dialog table{border-collapse:collapse;font-size:16px}
dialog th,dialog td{padding:7px 14px;text-align:right;border-bottom:1px solid var(--line)}
dialog th:first-child,dialog td:first-child{text-align:left;padding-left:0}
dialog .actions{margin-top:18px}
dialog .btn{height:46px;font-size:16px;padding:0 18px}

<script>
const PREVIEW=false;

/* ---------- shapes ---------- */
function starPts(){
  const p=[];
  for(let i=0;i<10;i++){const r=i%2?.21:.5,a=-Math.PI/2+i*Math.PI/5;p.push((.5+r*Math.cos(a)).toFixed(3)+','+(.54+r*Math.sin(a)).toFixed(3))}
  return p.join(' ');
}
const SH={
  circle:  {cls:'c-red',    draw:'<circle cx=".5" cy=".5" r=".46"/>'},
  square:  {cls:'c-blue',   draw:'<rect x=".06" y=".06" width=".88" height=".88" rx=".14"/>'},
  triangle:{cls:'c-yellow', draw:'<polygon points=".5,.04 .97,.93 .03,.93"/>'},
  star:    {cls:'c-green',  draw:'<polygon points="'+starPts()+'"/>'},
  heart:   {cls:'c-pink',   draw:'<path d="M.5 .92C.1 .62 0 .42 0 .28 0 .12 .13 0 .28 0 .38 0 .46 .06 .5 .15 .54 .06 .62 0 .72 0 .87 0 1 .12 1 .28 1 .42 .9 .62 .5 .92Z"/>'}
};
const NAMES={circle:'circles',square:'squares',triangle:'triangles',star:'stars',heart:'hearts'};
const KEYS=Object.keys(SH);
const shape=(k,x,y,s)=>`<g transform="translate(${x},${y}) scale(${s})" class="${SH[k].cls}">${SH[k].draw}</g>`;
const ico=k=>`<svg viewBox="-.04 -.04 1.08 1.08" role="img" aria-label="${NAMES[k]}"><g class="${SH[k].cls}">${SH[k].draw}</g></svg>`;

/* ---------- helpers ---------- */
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const simp=(a,b)=>{const g=gcd(a,b);return [a/g,b/g]};
const $=id=>document.getElementById(id);
const inputs=()=>[...document.querySelectorAll('#eqn input:not(.kin):not(.kmul)')];

const st={real:true,bookI:-1,fbi:0,guide:true,g:null,kDone:false,mode:'mix',simplest:false,showAns:true,p:null,attempted:false,done:false,solved:0,streak:0,hist:[],idx:-1};

/* ---------- generators ---------- */
function genP2P(){
  const n=Math.random()<.5?2:3, keys=shuffle(KEYS).slice(0,n), counts=keys.map(()=>rand(1,8));
  const [ia,ib]=shuffle([...Array(n).keys()]).slice(0,2);
  if(counts[ia]===counts[ib]) counts[ib]=counts[ib]%8+1;
  return {type:'p2p',rows:keys.map((k,i)=>({k,c:counts[i]})),focus:[keys[ia],keys[ib]],
    tags:[keys[ia],keys[ib]],ans:[counts[ia],counts[ib]],total:counts.reduce((s,c)=>s+c,0)};
}
function genP2W(){
  const n=Math.random()<.5?2:3, keys=shuffle(KEYS).slice(0,n), counts=keys.map(()=>rand(1,7));
  const i=rand(0,n-1), A=keys[i], a=counts[i], total=counts.reduce((s,c)=>s+c,0), rev=Math.random()<.45;
  return {type:'p2w',rows:keys.map((k,j)=>({k,c:counts[j]})),focus:[A],part:a,total,rev,
    tags:rev?['all',A]:[A,'all'],ans:rev?[total,a]:[a,total]};
}
function genEq(){
  const [A,B]=shuffle(KEYS).slice(0,2);
  let a=rand(1,5),b=rand(1,5); while(b===a) b=rand(1,5);
  [a,b]=simp(a,b);
  const k=rand(2,5), down=Math.random()<.35, small=[a,b], big=[a*k,b*k];
  const first=down?big:small, second=down?small:big, mi=rand(0,1);
  return {type:'eq',A,B,a,b,k,down,first,second,mi,ans:second[mi]};
}

/* ---------- quiz problems: Understanding Ratios (11/19) ---------- */
const F=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
/* The Understanding Ratios questions are rebuilt every session: the same kinds of problems
   (same stories), new numbers, shuffled order. */
const com=n=>n.toLocaleString('en-US');
const TEACH=['Ms. Rand','Mr. Chen','Mrs. Okafor','Ms. Rivera','Mr. Patel'];
function chainProb(n,story){   /* A : B and B : C share B; given A, find B and C */
  let a,b,c; do{a=rand(2,7);b=rand(2,7);c=rand(2,7)}while(new Set([a,b,c]).size<3||gcd(a,b)>1||gcd(b,c)>1);
  const k=rand(3,12), [L,q,newLab]=story(a,b,c,a*k);
  return {n,type:'rt',q,rows:[{l:L[0],a,b:a*k},{l:L[1],a:b,b:b*k,m:1},{l:L[2],a:c,b:c*k,m:1}],k,pairs:[[0,1],[1,2]],
    origLab:'Ratio',newLab,why:`${a*k} ÷ ${a} = ${k}, so ${b} × ${k} = ${b*k} ${L[1]} and ${c} × ${k} = ${c*k} ${L[2]}`};
}
function makeQuiz(){
  const Q=[];
  Q.push(chainProb('fish',(a,b,c,A)=>[['clown fish','angel fish','goldfish'],
    `The ratio of clown fish to angel fish at a pet store is ${a}:${b}. The ratio of angel fish to goldfish is ${b}:${c}. There are ${A} clown fish. How many angel fish and goldfish are there?`,'Fish in the store']));
  Q.push(chainProb('butterflies',(a,b,c,A)=>[['North American','South American','European'],
    `The ratio of North American butterflies to South American butterflies at a butterfly park is ${a}:${b}. The ratio of South American butterflies to European butterflies is ${b}:${c}. There are ${A} North American butterflies. How many South American and European butterflies are there?`,'Butterflies in the park']));
  { let r,c; do{r=rand(2,6);c=rand(3,8)}while(r===c); const N=rand(3,8);
    Q.push({n:'bouquet',type:'rt',q:`In each bouquet of flowers, there are ${r} roses and ${c} white carnations. How many roses and carnations are there in ${N} bouquets?`,
      rows:[{l:'bouquets',a:1,b:N},{l:'roses',a:r,b:r*N,m:1},{l:'carnations',a:c,b:c*N,m:1}],k:N,pairs:[[0,1],[0,2],[1,2]],
      origLab:'1 bouquet',newLab:`${N} bouquets`,why:`1 × ${N} = ${N} bouquets, so ${r} × ${N} = ${r*N} roses and ${c} × ${N} = ${c*N} carnations`}); }
  { let v; do{v=[rand(2,7),rand(2,6),rand(2,7),rand(4,10)]}while(new Set(v).size<4); const [b,a,p,st0]=v, k=rand(2,5), [nm,pr]=one(KID);
    Q.push({n:'salad',type:'rt',q:`${nm}’s fruit salad recipe uses ${b} bananas, ${a} apples, ${p} pears, and ${st0} strawberries. ${cap(pr)} wants to use ${st0*k} strawberries. How many bananas, apples, and pears should ${pr} use?`,
      rows:[{l:'strawberries',a:st0,b:st0*k},{l:'bananas',a:b,b:b*k,m:1},{l:'apples',a,b:a*k,m:1},{l:'pears',a:p,b:p*k,m:1}],k,pairs:[[0,1],[0,2],[0,3]],
      origLab:'Recipe',newLab:`${nm}’s fruit salad`,why:`${st0*k} ÷ ${st0} = ${k}, so ${b*k} bananas, ${a*k} apples, and ${p*k} pears`}); }
  { const c=rand(1,3), w=rand(1,5)+.5, k=rand(2,5), [nm,pr]=one(KID), J=c+w, cu=x=>x===1?'cup':'cups';
    Q.push({n:'juice',type:'rt',q:`${nm} needs to mix ${c} ${cu(c)} of orange juice concentrate with ${w} cups of water to make orange juice. ${cap(pr)} has ${c*k} cups of concentrate. How much water does ${pr} need, and how much orange juice can ${pr} make?`,
      rows:[{l:'concentrate',u:['cups concentrate','cup concentrate'],a:c,b:c*k},{l:'water',u:['cups water','cup water'],a:w,b:w*k,m:1},{l:'orange juice',u:['cups juice','cup juice'],a:J,as:`${c} + ${w}`,b:J*k,m:1}],k,pairs:[[0,1],[0,2]],
      wrong:[[1,w*k,`${w*k} is just the water. Orange juice is water and concentrate.`]],
      origLab:'Recipe',newLab:`${nm}’s orange juice`,why:`${c*k} ÷ ${c} = ${k}, so ${w} × ${k} = ${w*k} cups water. ${c*k} + ${w*k} = ${J*k} cups orange juice`}); }
  { const [a,b]=coprime(2,7,2,6), k=rand(3,9);
    Q.push({n:'coffee',type:'we',q:`${one(TEACH)} uses ${a} tablespoons of coffee for every ${b} cups of water. How many tablespoons of coffee does she use for ${b*k} cups of water?`.replace(/Mr\. (\w+) uses(.*)she use/,'Mr. $1 uses$2he use'),
      tags:['coffee','water'],lab:['tbsp coffee','cups water'],fbu:[['tbsp coffee','tbsp coffee'],['cups water','cup water']],vals:[a,b,a*k,b*k],miss:[2],k,
      origLab:'Recipe',newLab:`${b*k} cups of water`,why:`${b*k} ÷ ${b} = ${k}, so ${a} × ${k} = ${a*k} tablespoons`}); }
  /* the zoo: new counts, five pairs (most of them simplify) */
  { const names=['elephants','giraffes','lions','seals','otters'], cols=['blue','yellow','red','green','pink'];
    let c,simp2,plain2; do{c=names.map(()=>rand(6,18));
      const P=[];for(let i=0;i<5;i++)for(let j=i+1;j<5;j++)if(c[i]!==c[j])P.push(Math.random()<.5?[i,j]:[j,i]);   /* each pair of animals at most once */
      simp2=shuffle(P.filter(([i,j])=>gcd(c[i],c[j])>1)); plain2=shuffle(P.filter(([i,j])=>gcd(c[i],c[j])===1));
    }while(new Set(c).size<5||simp2.length<4||!plain2.length);
    const total=c.reduce((x,y)=>x+y,0), BARS=names.map((l,i)=>({label:l,segs:[{v:c[i],c:cols[i]}]}));
    const ZOO=`A zoo has ${c[0]} elephants, ${c[1]} giraffes, ${c[2]} lions, ${c[3]} seals, and ${c[4]} otters.`;
    [...simp2.slice(0,4),plain2[0]].forEach(([i,j])=>{const [x,y]=[c[i],c[j]],[sx,sy]=simp(x,y);
      Q.push({n:'zoo',type:'wr',kind:'p2p',simp:true,frac:true,q:`${ZOO}<br>What is the ratio of <b class="rq">${names[i]} to ${names[j]}</b>? Write it as a fraction in simplest form.`,
        tags:[names[i],names[j]],ans:[x,y],total,bars:BARS,barsR:[{...BARS[i],hl:1},{...BARS[j],hl:1},...BARS.filter((r,z)=>z!==i&&z!==j)],
        why:gcd(x,y)>1?`${x}:${y} = ${sx}:${sy}, so ${sx}/${sy}`:`${x}:${y} is already in simplest form, so ${x}/${y}`})});
  }
  /* big proportions: a/b = ?/(b·k) = (a·m)/(b·m) */
  for(let t=0;t<2;t++){ const [a,b]=coprime(2,9,3,9), k=rand(2,9); let m; do{m=rand(3,15)}while(m===k);
    Q.push({n:'fp',type:'we',q:'Find the missing term to make the ratios equivalent.',more:[[a*m,b*m]],nofb:true,
      tags:['',''],lab:['top','bottom'],fbu:[['top number','top'],['bottom number','bottom']],plain:true,vals:[a,b,a*k,b*k],miss:[2],k,
      origLab:'Fraction',newLab:'Equivalent fraction',why:`${b} × ${k} = ${b*k}, so ${a} × ${k} = ${a*k}. Check: ${a} × ${m} = ${a*m} and ${b} × ${m} = ${b*m}`}); }
  /* apples to corn muffins: the missing term in the first ratio, then in the second */
  { const [a,b]=coprime(2,7,3,11), k=rand(4,12);
    Q.push({n:'muffins1',type:'we',q:`Find the missing term to make the ratios equivalent.<br>${a} apples to <b>?</b> corn muffins<br>${a*k} apples to ${b*k} corn muffins`,
      tags:['apples','muffins'],fbu:['apples','corn muffins'],vals:[a,b,a*k,b*k],miss:[1],k,origLab:'Ratio',newLab:'Equivalent ratio',why:`${a*k} ÷ ${a} = ${k}, so ${b*k} ÷ ${k} = ${b} corn muffins`}); }
  { const [a,b]=coprime(2,7,3,11), k=rand(4,13);
    Q.push({n:'muffins2',type:'we',q:`Find the missing term to make the ratios equivalent.<br>${a} apples to ${b} corn muffins<br>${a*k} apples to <b>?</b> corn muffins`,
      tags:['apples','muffins'],fbu:['apples','corn muffins'],vals:[a,b,a*k,b*k],miss:[3],k,origLab:'Ratio',newLab:'Equivalent ratio',why:`${a*k} ÷ ${a} = ${k}, so ${b} × ${k} = ${b*k} corn muffins`}); }
  /* snakes: venomous to non-venomous, venomous to all */
  { let T,d; do{T=one([2000,2400,3000,3600,4000,4500,5000,6000]);d=one([3,4,5,6,8,10])}while(T%d);
    const V=T/d, N=T-V, S=`There are more than ${com(T)} species of snakes. About ${com(V)} species are venomous.`, [s1,s2]=simp(V,N);
    Q.push({n:'snakes1',type:'wr',simp:true,frac:true,q:S+' What is the ratio of venomous snakes to non-venomous snakes in simplest form? Write your answer as a fraction.',
      tags:['venomous','non-venomous'],ans:[V,N],why:`${com(T)} − ${com(V)} = ${com(N)} non-venomous. ${com(V)}:${com(N)} = ${s1}:${s2}, so ${s1}/${s2}`,
      wrong:[[[V,T],`That compares to all the snakes. Non-venomous = ${com(T)} − ${com(V)}.`],[[N,V],'Check the order: venomous comes first.']],
      bars:[{label:'all snakes',segs:[{v:T,c:'green'}]},{label:'venomous',segs:[{v:V,c:'red'}]}],
      barsR:[{label:'venomous',segs:[{v:V,c:'red'}],hl:1},{label:'non-venomous',segs:[{v:N,c:'green'}],hl:1}]});
    Q.push({n:'snakes2',type:'wr',simp:true,frac:true,q:S+' What is the ratio of venomous snakes to all snakes in simplest form? Write your answer as a fraction.',
      tags:['venomous','all'],fbu:['venomous','snakes'],ans:[V,T],why:`${com(V)}:${com(T)} = 1:${d}, so 1/${d}`,
      wrong:[[[V,N],'Compare to all the snakes, not just the non-venomous ones.'],[[T,V],'Check the order: venomous comes first.']],
      bars:[{label:'all snakes',segs:[{v:T,c:'green'}]},{label:'venomous',segs:[{v:V,c:'red'}]}],
      barsR:[{label:'venomous',segs:[{v:V,c:'red'}],hl:1},{label:'all snakes',segs:[{v:V,c:'red'},{v:N,c:'green'}],hl:1}]}); }
  return shuffle(Q).map(p=>({...p,book:true,set:'quiz'}));
}
let QUIZ=[];
const SETS={quiz:QUIZ};

function nextBook(){const S=SETS[st.mode];st.bookI=(st.bookI+1)%S.length;return S[st.bookI]}
/* quiz problems also show up in the matching type tabs, mixed in with the generated ones */
const POOL={};['p2p','p2w','eq'].forEach(m=>POOL[m]={all:QUIZ.filter(p=>p.pool===m),left:[],cool:0});
function fromPool(m){
  const P=POOL[m];
  if(!P.left.length){ if(P.cool>0){P.cool--;return null} P.left=shuffle(P.all); P.cool=6; }
  return Math.random()<.35?P.left.pop():null;
}

/* written prompt: students read which groups and which order (no labels over the boxes) */
const cap=t=>t[0].toUpperCase()+t.slice(1);
function promptFor(p){
  const pick=a=>a[rand(0,a.length-1)];
  if(p.type==='p2p'){
    const [a,b]=p.tags.map(k=>NAMES[k]);
    return pick([`The number of ${a} to the number of ${b}`,`${cap(a)} to ${b}`,`The ratio of ${a} to ${b}`,`Compare ${a} to ${b}`]);
  }
  const a=NAMES[p.focus[0]];
  return p.rev
    ?pick([`All the shapes to ${a}`,`The total number of shapes to the number of ${a}`,`Compare all the shapes to the ${a}`])
    :pick([`${cap(a)} to all the shapes`,`The number of ${a} to the total number of shapes`,`The ratio of ${a} to all the shapes`]);
}
/* ---------- real-life scenarios (random numbers each time) ---------- */
const one=a=>a[rand(0,a.length-1)];
const KID=[['Maya','she'],['Jordan','he'],['Luis','he'],['Aisha','she'],['Ethan','he'],['Sofia','she'],['Malik','he'],['Chloe','she'],['Andre','he'],['Priya','she'],['Marcus','he'],['Zoe','she']];
const money=v=>'$'+(isInt(v)?v:v.toFixed(2));
const ratioWhy=(x,y,pre)=>{const [a,b]=simp(x,y);return (pre?pre+' ':'')+`${x}:${y}`+(a!==x?` = ${a}:${b}`:'')};

/* "40 vehicles … 22 are cars and 12 are trucks. The rest are motorcycles." */
const restTxt=(ph,rest,c,h)=>{const t=ph.map((f,i)=>i===h?null:f(c[i])).filter(Boolean);return cap(t.length>1?t.slice(0,-1).join(', ')+' and '+t[t.length-1]:t[0])+'. '+rest[h]};
/* groups of things to count: [label, singular, low, high] */
const GRP=[
 {cat:'School',g:[['boys','boy',8,16],['girls','girl',8,16]],all:['students','student'],whole:'all the students in the class',
  set:c=>`${one(['Ms. Rivera','Mr. Chen','Mrs. Okafor','Mr. Patel'])}’s class has ${c[0]} boys and ${c[1]} girls.`,
  alt:(c,h,T)=>`${one(['Ms. Rivera','Mr. Chen','Mrs. Okafor','Mr. Patel'])}’s class has ${T} students. `+restTxt([n=>`${n} are boys`,n=>`${n} are girls`],['The rest are boys.','The rest are girls.'],c,h)},
 {cat:'Sports',g:[['wins','win',5,14],['losses','loss',2,10]],all:['games','game'],whole:'the number of games played',
  set:c=>`The ${one(['Riverside Tigers','Eastside Eagles','Lakeview Lions'])} won ${c[0]} games and lost ${c[1]} games this season.`,
  alt:(c,h,T)=>`The ${one(['Riverside Tigers','Eastside Eagles','Lakeview Lions'])} played ${T} games this season with no ties. `+restTxt([n=>`they won ${n}`,n=>`they lost ${n}`],['They won the rest.','They lost the rest.'],c,h)},
 {cat:'Sports',g:[['shots made','shot made',6,15],['shots missed','shot missed',3,10]],all:['shots','shot'],whole:'the number of free throws taken',
  set:c=>{const [k]=one(KID);return `At practice, ${k} made ${c[0]} free throws and missed ${c[1]}.`},
  alt:(c,h,T)=>{const [k,pr]=one(KID);return `At practice, ${k} took ${T} free throws. `+restTxt([n=>`${pr} made ${n}`,n=>`${pr} missed ${n}`],[`${cap(pr)} made the rest.`,`${cap(pr)} missed the rest.`],c,h)}},
 {cat:'Survey',g:[['dogs','dog',6,14],['cats','cat',4,12],['fish','fish',2,6]],all:['pets','pet'],whole:'all the pets in the survey',
  set:c=>`A class took a pet survey. Students have ${c[0]} dogs, ${c[1]} cats, and ${c[2]} fish.`,
  alt:(c,h,T)=>`A class took a pet survey. Students have ${T} pets: dogs, cats, and fish. `+restTxt([n=>`${n} are dogs`,n=>`${n} are cats`,n=>`${n} are fish`],['The rest are dogs.','The rest are cats.','The rest are fish.'],c,h)},
 {cat:'Weather',g:[['sunny days','sunny day',8,16],['rainy days','rainy day',4,9],['cloudy days','cloudy day',0,0]],all:['days','day'],whole:'all the days in November',
  fix:c=>{c[2]=30-c[0]-c[1]}, set:c=>`In November (30 days) there were ${c[0]} sunny days, ${c[1]} rainy days, and ${c[2]} cloudy days.`,
  alt:(c,h,T)=>`November has ${T} days. `+restTxt([n=>`${n} were sunny`,n=>`${n} were rainy`,n=>`${n} were cloudy`],['The rest were sunny.','The rest were rainy.','The rest were cloudy.'],c,h)},
 {cat:'Music',g:[['hip-hop songs','hip-hop song',6,18],['pop songs','pop song',4,16],['country songs','country song',2,10]],all:['songs','song'],whole:'all the songs on the playlist',
  set:c=>{const [k]=one(KID);return `${k}’s playlist has ${c[0]} hip-hop songs, ${c[1]} pop songs, and ${c[2]} country songs.`},
  alt:(c,h,T)=>{const [k]=one(KID);return `${k}’s playlist has ${T} songs: hip-hop, pop, and country. `+restTxt([n=>`${n} are hip-hop songs`,n=>`${n} are pop songs`,n=>`${n} are country songs`],['The rest are hip-hop songs.','The rest are pop songs.','The rest are country songs.'],c,h)}},
 {cat:'Lunch',g:[['bought lunch','bought lunch',12,30],['brought lunch','brought lunch',6,20]],all:['students','student'],whole:'all the students in the cafeteria',
  set:c=>`In the cafeteria, ${c[0]} students bought school lunch and ${c[1]} students brought lunch from home.`,
  alt:(c,h,T)=>`There are ${T} students in the cafeteria. `+restTxt([n=>`${n} bought school lunch`,n=>`${n} brought lunch from home`],['The rest bought school lunch.','The rest brought lunch from home.'],c,h)},
 {cat:'Parking',g:[['cars','car',12,30],['trucks','truck',4,12],['motorcycles','motorcycle',2,6]],all:['vehicles','vehicle'],whole:'all the vehicles in the lot',
  set:c=>`A parking lot has ${c[0]} cars, ${c[1]} trucks, and ${c[2]} motorcycles.`,
  alt:(c,h,T)=>`A parking lot has ${T} vehicles: cars, trucks, and motorcycles. `+restTxt([n=>`${n} are cars`,n=>`${n} are trucks`,n=>`${n} are motorcycles`],['The rest are cars.','The rest are trucks.','The rest are motorcycles.'],c,h)},
 {cat:'Snacks',g:[['red','red',4,12],['green','green',3,10],['orange','orange',2,8]],all:['fruit snacks','fruit snack'],whole:'all the fruit snacks in the bag',
  set:c=>`A bag of fruit snacks has ${c[0]} red, ${c[1]} green, and ${c[2]} orange.`,

/* the second word in each group's label is enough for the question when it's clear, e.g. "red fruit snacks" */
const grpName=(sc,i)=>sc.cat==='Snacks'?sc.g[i][0]+' fruit snacks':sc.cat==='Lunch'?`students who ${sc.g[i][0]}`:sc.g[i][0];
function grpProb(sc,kind){
  /* Variants, so the numbers are never just read off in order:
     hide  – the total is given and one group is "the rest" (subtract first)
     comb  – one side of the ratio is two groups together (add first)
     plain – every group is listed; the question asks in a different order than the story */
  const n=sc.g.length, three=n===3, r=Math.random();
  const v=kind==='p2p'?(three?(r<.35?'hide':r<.7?'comb':'plain'):(r<.7?'hide':'plain'))
                      :(three?(r<.35?'hide':r<.65?'comb':'plain'):(r<.6?'hide':'plain'));
  let c; do{c=sc.g.map(g=>rand(g[2],g[3])); if(sc.fix) sc.fix(c)}while(new Set(c).size<n||c.some(x=>x<1));
  const total=c.reduce((a,b)=>a+b,0), U=k=>[sc.g[k][0],sc.g[k][1]], G=k=>grpName(sc,k), all=sc.all[0];
  const both=L=>sc.cat==='Snacks'?L.map(x=>sc.g[x][0]).join(' and ')+' fruit snacks':L.map(G).join(' and ');
  let i,j,h=-1;
  if(kind==='p2p'){
    if(v==='plain'){[i,j]=shuffle([...Array(n).keys()]).slice(0,2); if(i<j&&Math.random()<.75)[i,j]=[j,i]}
    else if(v==='hide'){[i,j]=shuffle([...Array(n).keys()]).slice(0,2); h=Math.random()<.5?i:j}
    else i=rand(0,n-1);
  }else{ i=rand(0,n-1); if(v==='hide') h=i }
  const others=[...Array(n).keys()].filter(x=>x!==i), oSum=others.reduce((t,x)=>t+c[x],0);
  const story=v==='hide'?sc.alt(c,h,total):sc.set(c);
  const hideWhy=h<0?'':`${total} − ${others.concat(i).filter(x=>x!==h).map(x=>c[x]).join(' − ')} = ${c[h]} ${sc.g[h][0]}.`;
  const focus=kind==='p2p'?(v==='comb'?[i,...others]:[i,j]):(v==='comb'?others:[i]);
  const pic={kind:'count',rows:c.map((x,q)=>({...emo(sc.g[q][0]),l:sc.g[q][0],n:x,hide:q===h})),focus,whole:kind==='p2w',total};
  const base={book:true,set:kind,n:sc.cat,type:'wr',kind,total,pic};
  if(kind==='p2p'){
    if(v==='comb'){
      const cn=both(others), other=Math.random()<.5, B=other?`all the other ${all}`:`${cn} together`;
      const rev=Math.random()<.4, lab=other?`other ${all}`:others.map(x=>sc.g[x][0]).join(' + ');
      const A=[c[i],oSum], tg=[sc.g[i][0],lab], fu=[U(i),[lab,lab]];
      const why=`${others.map(x=>c[x]).join(' + ')} = ${oSum} ${other?'other '+all:cn}. `;
      return {...base,q:`${story} What is the ratio of ${rev?B+' to '+G(i):G(i)+' to '+B}?`,
        tags:rev?tg.reverse():tg,fbu:rev?fu.reverse():fu,ans:rev?A.reverse():A,
        why:why+(rev?ratioWhy(oSum,c[i]):ratioWhy(c[i],oSum)),
        wrong:others.map(x=>[rev?[c[x],c[i]]:[c[i],c[x]],other?`Count all the other ${all}, not just the ${G(x)}.`:`Use both groups, not just the ${G(x)}.`])
          .concat([[rev?[total,c[i]]:[c[i],total],`${total} is all the ${all}. Leave out the ${G(i)}.`]])};
    }
    return {...base,q:`${story} What is the ratio of ${G(i)} to ${G(j)}?`,
      tags:[sc.g[i][0],sc.g[j][0]],fbu:[U(i),U(j)],ans:[c[i],c[j]],why:(hideWhy?hideWhy+' ':'')+ratioWhy(c[i],c[j]),
      wrong:h<0?[]:[[h===i?[total,c[j]]:[c[i],total],`${total} is all the ${all}. First find the number of ${G(h)}.`]]};
  }
  /* part to whole */
  const rev=Math.random()<.45, sum=`${c.join(' + ')} = ${total} ${all}.`;
  const part=v==='comb'?oSum:c[i], pName=v==='comb'?both(others)+' together':G(i);
  const pLab=v==='comb'?others.map(x=>sc.g[x][0]).join(' + '):sc.g[i][0], pU=v==='comb'?[pLab,pLab]:U(i);
  const why=v==='hide'?hideWhy:v==='comb'?`${others.map(x=>c[x]).join(' + ')} = ${oSum}. `+sum:sum;
  const wrong=[[rev?[total-part,part]:[part,total-part],`Compare to all the ${all}, not just the rest.`]];
  if(v==='hide') wrong.push([rev?[total,total-part]:[total-part,total],`That’s the ${both(others)}. Use the ${G(i)}.`]);
  if(v==='comb') others.forEach(x=>wrong.push([rev?[total,c[x]]:[c[x],total],`Count both groups, not just the ${G(x)}.`]));
  return {...base,part,rev,
    q:`${story} What is the ratio of ${rev?sc.whole+' to '+pName:pName+' to '+sc.whole}?`,
    tags:rev?['all',pLab]:[pLab,'all'],fbu:rev?[sc.all,pU]:[pU,sc.all],
    ans:rev?[total,part]:[part,total],why:rev?ratioWhy(total,part,why):ratioWhy(part,total,why),wrong};
}

function fitEqn(){
  const e=$('eqn'), W=e.parentElement, avail=W.clientWidth-16;
  const fits0=()=>{const r=W.getBoundingClientRect(),k=[...W.children].filter(c=>!c.hidden&&c.offsetHeight);
    return !k.length||(k[0].getBoundingClientRect().top>=r.top-1&&k[k.length-1].getBoundingClientRect().bottom<=r.bottom+1)};
  if(st.zl){e.style.zoom=st.zl; if(fits0()&&e.scrollWidth*(+st.zl||1)<=avail+2) return;}
  e.style.zoom='';
  let z=1; const w=e.scrollWidth;
  if(w>avail){z=avail/w; e.style.zoom=z.toFixed(3)}
  /* also shrink until everything in the answer column fits top to bottom */
  const fits=()=>{const r=W.getBoundingClientRect(),k=[...W.children].filter(c=>!c.hidden&&c.offsetHeight);
    return !k.length||(k[0].getBoundingClientRect().top>=r.top-1&&k[k.length-1].getBoundingClientRect().bottom<=r.bottom+1)};
  for(let i=0;i<10&&!fits();i++){z*=.92; e.style.zoom=z.toFixed(3)}

function propInfo(p){

/* ---------- guided steps for equivalent ratios: 1. find the multiplier, 2. use it ---------- */
const KIN='<input class="kin" inputmode="numeric" autocomplete="off" maxlength="3" aria-label="What number?">';
function gInfo(p){
  if(!st.guide) return null;
  if(p.type==='rt'){const g=p.rows.find(r=>!r.m);return {a:g.a,b:g.b,k:p.k,op:'×',inline:true,lab:g.l,okmsg:`Use × ${p.k} in every row.`}}
  let c,miss,tags;
  if(p.type==='eq'){c=[...p.first,...p.second];miss=[2+p.mi];tags=[p.A,p.B]}
  else if(p.type==='we'){c=p.vals;miss=p.miss;tags=p.tags}
  else return null;
  const pos=[0,1].find(i=>!miss.includes(i)&&!miss.includes(i+2));
  if(pos===undefined) return null;
  const a=c[pos],b=c[pos+2],down=b<a,k=down?a/b:b/a,op=down?'÷':'×',inv=down?'×':'÷';
  if(!isInt(k)||k===1) return null;

  g.lab=p.type==='eq'?NAMES[tags[pos]]:(()=>{const t=(p.plain?['','']:(p.lab||p.tags))[pos];return !t?(pos?'bottom number':'top number'):t==='$'?'dollars':t})();
  if(miss.length===1){

  return g;

function rowsInit(){

function rowCheck(){
  const R=st.rw,o=R.rows[R.ai],g=st.g,ins=inputs();

  }
  const empty=o.els.find(i=>!i.value); if(empty){say('info',o.els.length>1?'Fill in both boxes.':'Fill in the box.');empty.focus();return}

function acceptK(){
  const g=st.g; st.kDone=true; st.step=4; $('checkBtn').textContent='Check'; updArc();

function checkK(){

  say('bad',(+el.value===big-small?(g.op==='×'?'Multiply. Don’t add. ':'Divide. Don’t subtract. '):'')+`Think: ${big} ÷ ${small} = ?`);

function explain(p){

/* ---------- student flow ---------- */
function targets(p){
  if(p.type==='eq') return [[p.ans]];
  if(p.type==='we') return [p.miss.map(j=>p.vals[j])];
  if(p.type==='rt') return [p.rows.filter(r=>r.m).map(r=>r.b)];
  if(p.type==='tape') return [p.steps.map(x=>x.ans)];
  return [p.ans,simp(...p.ans)];
}
function onInput(e){
  const t=e.target; t.value=t.value.replace(/[^\d.]/g,'');
  t.classList.toggle('long',t.value.length>3);
  if(st.rw&&!st.done){rowInput(t);return}
  if(st.p.type==='tape'&&!st.done){tapeInput(t);return}
  if(st.sim&&!st.done){
    t.classList.remove('ok','no');
    const si=[...document.querySelectorAll('#eqn input.sim')], [sa,sb]=simp(...st.simFrom), j=si.indexOf(t);
    if(si.every(i=>i.value!=='')&&+si[0].value===sa&&+si[1].value===sb){check();return}
    if(j===0&&+t.value===sa&&!si[1].value) si[1].focus();
    return;
  }
  inputs().forEach(i=>i.classList.remove('ok','no'));
  if(st.done) return;
  const ins=inputs(), vals=ins.map(i=>i.value===''?null:+i.value), i=ins.indexOf(t), T=targets(st.p);
  if(vals.every(v=>v!==null)&&T.some(tg=>tg.every((x,j)=>x===vals[j]))){check();return}
  const nx=ins.slice(i+1).find(x=>!x.value);
  /* move on only when no longer answer could still be coming (typing 3 of 33 must not jump) */
  const typed=t.value, longer=T.some(tg=>String(tg[i]).length>typed.length&&String(tg[i]).startsWith(typed));
  if(nx&&!longer&&T.some(tg=>tg[i]===vals[i])) nx.focus();
}
function judgeRatio(p,x,y){
  const [a,b]=p.ans,[sa,sb]=simp(a,b);
  if(x*b===y*a){
    const g=gcd(x,y);
    if(p.book&&p.why) return {res:'good',msg:'✓ '+p.why};
    return {res:'good',msg:'✓ Correct'+(gcd(a,b)>1&&!(x===sa&&y===sb)?`. Simplest form: ${sa}:${sb}`:'')};
  }
  for(const [[wa,wb],msg] of p.wrong||[]) if(x*wb===y*wa) return {res:'bad',msg};
  if(x*a===y*b) return {res:'bad',msg:'Check the order.'};
  const kind=p.kind||p.type;
  if(kind==='p2w'){const o=p.total-p.part;if((x===p.part&&y===o)||(x===o&&y===p.part))return {res:'bad',msg:'The whole is all the shapes.'}}
  if(kind==='p2p'&&(x===p.total||y===p.total)) return {res:'bad',msg:'Use only the two groups.'};
  return {res:'bad',msg:'Try again.'};
}
function judgeEq(p,n){
  if(n===p.ans) return {res:'good',msg:'✓ '+explain(p)};
  const o=1-p.mi;
  if(n===p.first[p.mi]+(p.second[o]-p.first[o])) return {res:'bad',msg:'Multiply or divide. Don\u2019t add.'};
  return {res:'bad',msg:'Try again.'};
}
function judgeWe(p,n){
  const T=p.miss.map(j=>p.vals[j]);
  if(n.every((x,i)=>x===T[i])) return {res:'good',msg:'✓ '+p.why};
  for(const [bi,v,msg] of p.wrong||[]) if(n[bi]===v) return {res:'bad',msg};
  if(p.miss.length===1&&p.miss[0]>=2){
    const m=p.miss[0], o=m===2?3:2;
    if(n[0]===p.vals[m-2]+(p.vals[o]-p.vals[o-2])) return {res:'bad',msg:'Multiply or divide. Don\u2019t add.'};
  }
  if(p.hint&&n[0]!==T[0]) return {res:'bad',msg:p.hint};
  return {res:'bad',msg:'Try again.'};
}
function judgeRt(p,n){
  const M=p.rows.filter(r=>r.m), ok=n.map((x,i)=>x===M[i].b), g=p.rows.find(r=>!r.m);
  if(ok.every(Boolean)) return {res:'good',msg:'✓ '+p.why,ok};
  for(const [bi,v,msg] of p.wrong||[]) if(n[bi]===v) return {res:'bad',msg,ok};
  if(M.some((r,i)=>!ok[i]&&n[i]===r.a+(g.b-g.a))) return {res:'bad',msg:'Multiply. Don\u2019t add.',ok};
  return {res:'bad',msg:ok.some(Boolean)?'Check the red box.':`${g.a} times what number = ${g.b}? Use that same number in every row.`,ok};
}
const statKey=p=>p.set||p.type;
function record(ok){
  stat(s=>s.checks++);
  if(!st.attempted){
    st.attempted=true;
    st.streak=ok?st.streak+1:0;
    const k=statKey(st.p);
    stat(s=>{s.tried++;s.by[k]=s.by[k]||[0,0];s.by[k][0]++;if(ok){s.first++;s.by[k][1]++}s.best=Math.max(s.best,st.streak)});
  }
}
function pick(i){
  if(PREVIEW||st.done) return;
  const p=st.p, ok=i===p.ans, bs=[...document.querySelectorAll('#eqn .choice')];
  bs.forEach(b=>b.classList.remove('ok','no'));
  bs[i].classList.add(ok?'ok':'no');
  record(ok);
  if(ok){say('good','✓ '+p.why);st.solved++;stat(s=>s.solved++);updateCount();finish()}
  else{say('bad',(p.nopes&&p.nopes[i])||p.nope);$('showBtn').hidden=false}
}
function check(){
  if(PREVIEW||st.done) return;
  if(isFP(st.p)){fpCheck();return}
  if(st.sim){simCheck();return}
  if(st.step<3){advStep();return}
  if(st.g&&!st.kDone){checkK();return}
  if(st.rw&&!rowsAllOk()){rowCheck();return}
  if(st.p.type==='tape'&&st.ts<st.p.steps.length){tapeCheck();return}
  const p=st.p, ins=inputs(), empty=ins.find(i=>!i.value);
  if(p.type==='pick'){say('info','Tap an answer.');focusFirst();return}
  if(empty){say('info',ins.length>1?'Fill in both boxes.':'Fill in the box.');empty.focus();return}
  const n=ins.map(i=>+i.value);
  if(p.type!=='eq'&&n.some(x=>x===0)){say('info','Use numbers bigger than 0.');ins[0].focus();return}
  const r=p.type==='tape'?{res:'good',msg:'✓ '+p.why}:p.type==='eq'?judgeEq(p,n[0]):p.type==='we'?judgeWe(p,n):p.type==='rt'?judgeRt(p,n):judgeRatio(p,n[0],n[1]);
  if(r.res==='info'){say('info',r.msg);ins[0].focus();ins[0].select();return}
  const ok=r.res==='good';
  record(ok);
  if(ok&&n.length===2&&!['eq','we','rt','tape'].includes(p.type)&&gcd(n[0],n[1])>1){simStart(n[0],n[1]);return}
  say(r.res,r.msg);
  if(ok){
    ins.forEach(i=>i.classList.add('ok'));
    st.solved++; stat(s=>s.solved++); updateCount(); finish();
  }else{
    ins.forEach((i,j)=>i.classList.add(r.ok&&r.ok[j]?'ok':'no'));
    const bad=ins.find(i=>i.classList.contains('no'))||ins[0];
    $('showBtn').hidden=false; bad.focus(); bad.select();
  }
}
function showAnswer(){
  if(isFP(st.p)){fpShow();return}
  const p=st.p, ins=inputs();
  st.kDone=true; updArc(); ins.forEach(i=>i.classList.remove('lock'));
  if(p.type==='pick'){
    document.querySelectorAll('#eqn .choice').forEach((b,i)=>{b.classList.remove('no');if(i===p.ans)b.classList.add('shown')});
  }else if(p.type==='eq') ins[0].value=p.ans;
  else if(p.type==='we'||p.type==='rt') targets(p)[0].forEach((v,j)=>ins[j].value=v);
  else if(p.type==='tape') p.steps.forEach((x,j)=>ins[j].value=x.ans);
  else {ins[0].value=p.ans[0];ins[1].value=p.ans[1];
    if(gcd(...p.ans)>1){if(!st.sim)simAdd();const sv=simp(...p.ans),si=document.querySelectorAll('#eqn input.sim');si[0].value=sv[0];si[1].value=sv[1]}
    ins.length=0;ins.push(...inputs())}
  ins.forEach(i=>{i.classList.remove('no','ok');i.classList.add('shown');i.classList.toggle('long',i.value.length>3)});
  stat(s=>s.shown++); say('info',explain(p)); finish();
}
function finish(){
  document.querySelectorAll('#eqn .tline.later').forEach(l=>l.classList.remove('later'));
  document.querySelectorAll('#eqn .tline').forEach(l=>l.classList.add('solved'));
  st.step=4; {const t=document.querySelector('#eqn .rtab'); if(t){t.classList.remove('s1','s2','s3');t.querySelectorAll('.later,.now').forEach(c=>c.classList.remove('later','now'));t.querySelectorAll('input.kmul').forEach(i=>i.outerHTML='<span class="kq"></span>')}}
  st.rw=null;
  st.done=true; renderVisual(true); showTags(); if(isFP(st.p)) fpDone();
  if(st.g){swapK();renderGuide()}
  updArc();
  document.querySelectorAll('#eqn .kq').forEach(k=>k.textContent=st.prop&&st.prop.k?+st.prop.k.toFixed(3):st.p.k);
  document.querySelectorAll('#eqn input,#eqn .choice').forEach(i=>i.disabled=true);
  $('checkBtn').hidden=true; $('showBtn').hidden=true; $('nextBtn').hidden=false;
  $('nextBtn').focus();
}
function focusFirst(){if(st.rw&&!st.done){const o=st.rw.rows[st.rw.ai];if(o&&!o.kDone&&o.k&&!o.k.disabled){o.k.focus();return}}if(st.step<3&&!st.done&&!PREVIEW&&$('checkBtn')){$('checkBtn').focus();return}const f=document.querySelector('.kin,#eqn input:not(:disabled),#eqn .choice');if(f){f.focus();requestAnimationFrame(()=>f.focus())}}
function updateCount(){
  $('count').innerHTML=PREVIEW?`#<b>${st.idx+1}</b>`:`Solved<b>${st.solved}</b> / ${GOAL}`;
  if(!PREVIEW&&st.solved>=GOAL&&!TI.auto){TI.auto=true;setTimeout(openTurnIn,1200)}   /* 30 solved: turn in shows up */

      <input type="hidden" id="tiFCode" name="entry.1999309314" value="">
      <input type="hidden" id="tiFScore" name="entry.1276394101" value="">
      <input type="hidden" id="tiFDrill" name="entry.582215829" value="">
      <button type="submit" class="btn primary" id="tiSubmit">${more?'Send updated results':'Submit results'}</button>
    </form>
    <p class="ti-feedback" id="tiFeedback">${TI.note||(more?'You turned in before. Send again to update your results.':'')}</p>
    <div><button type="button" class="btn" id="tiBack">Back to the problems</button></div>
  </section>`;
  $('tiCode').addEventListener('input',e=>{const el=e.target,v=el.value.replace(/\s+/g,'');if(v!==el.value)el.value=v;TI.code=v;saveCode()});
  $('ti_frame').addEventListener('load',()=>{
    if(!TI.sending)return;
    TI.sending=false;TI.sent=TI.pending;
    TI.note='<span class="ok">Submitted. Your teacher has your results.</span>';
    renderTurnIn();
  });
  $('tiForm').addEventListener('submit',()=>{
    const code=$('tiCode').value.trim().toUpperCase();
    $('tiFCode').value=code;$('tiFScore').value=String(st.solved);$('tiFDrill').value=DRILL_NAME;
    TI.code=code;saveCode();TI.pending=DRILL_NAME+': '+st.solved;TI.sending=true;
    $('tiFeedback').textContent='Sending…';
  });
  $('tiBack').onclick=closeTurnIn;
  m.onclick=e=>{if(e.target===m)closeTurnIn()};
  if(showForm)setTimeout(()=>{const el=TI.code?$('tiSubmit'):$('tiCode');if(el)el.focus()},50);
}

/* ---------- navigation ---------- */
function render(){
  st.sim=false; st.simFrom=null; st.attempted=false; st.done=false; st.fbi=0; st.fbShown=false;
  renderWork(); updateCount();
  if(PREVIEW){renderVisual(st.showAns); say('info',st.showAns?explain(st.p):'');}
  else{renderVisual(false); say('',''); $('checkBtn').textContent='Check'; $('checkBtn').hidden=false; $('showBtn').hidden=true; $('nextBtn').hidden=true; focusFirst(); stepUI();}
}
function next(){
  if(PREVIEW){
    if(st.idx<st.hist.length-1) st.idx++; else {st.hist.push(gen());st.idx=st.hist.length-1}
    st.p=st.hist[st.idx];
  }else{
    if(st.p&&!st.done) stat(s=>s.skipped++);
    st.p=gen();
  }
  render();
}
function back(){if(st.idx>0){st.idx--;st.p=st.hist[st.idx];render()}}
function newOfMode(){
  if(PREVIEW){st.hist=st.hist.slice(0,st.idx+1);st.hist.push(gen());st.idx=st.hist.length-1;st.p=st.hist[st.idx];render()}
  else next();
}

/* ---------- setup ---------- */
if(PREVIEW){
  document.title='Ratios (Preview)';
  $('ansToggle').hidden=false;
  $('actions').innerHTML='<button class="btn" id="backBtn">Back</button><button class="btn primary" id="nextBtn">Next</button>';
  $('backBtn').addEventListener('click',back);
  $('showAns').addEventListener('change',e=>{st.showAns=e.target.checked;render()});
}else{
  $('actions').innerHTML='<button class="btn primary" id="checkBtn">Check</button><button class="btn" id="showBtn" hidden>Show answer</button><button class="btn primary" id="nextBtn" hidden>Next</button>';
  $('checkBtn').addEventListener('click',check);
  $('showBtn').addEventListener('click',showAnswer);
}
$('nextBtn').addEventListener('click',next);
$('turnBtn').addEventListener('click',()=>{if(TI.open)closeTurnIn();else openTurnIn()});
$('guideT').addEventListener('change',e=>{
  st.guide=e.target.checked;
  if(PREVIEW||!st.done){const a=st.attempted;render();st.attempted=a}
});

document.addEventListener('keydown',e=>{
  if($('teacher').open) return;
  if(TI.open){if(e.key==='Escape')closeTurnIn();return}
  if(!PREVIEW&&e.shiftKey&&e.key==='T'){e.preventDefault();openTeacher();return}
  const t=e.target;
  if(PREVIEW){
    if(e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();next()}
    else if(e.key==='ArrowLeft'){e.preventDefault();back()}
    else if(e.key==='a'||e.key==='A'){$('showAns').click()}
    return;
  }
  if(e.key!=='Enter') return;
  if(t.tagName==='BUTTON'&&t.id!=='nextBtn') return;
  e.preventDefault();
  if(st.done||t.id==='nextBtn'){next();return}
  const ins=inputs(), i=ins.indexOf(t);
  if(i>-1&&t.value&&!st.rw&&st.p.type!=='tape'&&!isFP(st.p)){const nx=ins.slice(i+1).find(x=>!x.value);if(nx){nx.focus();return}}
  check();
});

/* never scroll: the whole page scales down to fit the window */
function fitApp(){
  const a=document.querySelector('.app'), w=innerWidth, h=innerHeight, tall=w<h*.9;
  const z=Math.min(1,w/(tall?760:1280),h/(tall?1250:700));
  a.classList.toggle('narrow',tall);
  a.style.zoom=z; a.style.width=w/z+'px'; a.style.height=h/z+'px';
  st.zl=null; fitEqn();
}
addEventListener('resize',fitApp); fitApp();
next();
</script>
